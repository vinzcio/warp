  <!-- Ember crescent (Hemisthia) -->
  <circle cx="52" cy="60" r="34" stroke="#E8A86A" stroke-width="3.5" fill="none" opacity="0.95"/>
  <circle cx="64" cy="60" r="28" fill="#0B0A12"/>
  <!-- Ember core (Harken) -->
  <circle cx="40" cy="60" r="5.5" fill="#F0B27A"/>
