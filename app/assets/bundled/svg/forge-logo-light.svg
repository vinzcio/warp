  <!-- Wordmark -->
  <text x="104" y="72" font-family="SF Pro Display, system-ui, -apple-system, sans-serif"
        font-size="42" font-weight="500" letter-spacing="0.08em" fill="#EDE8F0">FORGE</text>
  <text x="106" y="96" font-family="SF Pro Text, system-ui, -apple-system, sans-serif"
        font-size="11" font-weight="400" letter-spacing="0.22em" fill="#9A8FA8">HEMISTHIA · HARKEN</text>
</svg>
